# ==============================================================================
# ServiceAccounts: Least Privilege Workload Identities
# ==============================================================================
# Dedicated ServiceAccounts for each microservice in the 'app' namespace.
# automountServiceAccountToken: false prevents automatic projection of Kubernetes
# API credentials into pod filesystems, eliminating token theft risk.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: app
  labels:
    app: gateway
    app.kubernetes.io/name: gateway-sa
    app.kubernetes.io/component: rbac
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-sa
  namespace: app
  labels:
    app: catalog
    app.kubernetes.io/name: catalog-sa
    app.kubernetes.io/component: rbac
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assistant-sa
  namespace: app
  labels:
    app: assistant
    app.kubernetes.io/name: assistant-sa
    app.kubernetes.io/component: rbac
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-sa
  namespace: app
  labels:
    app: llm
    app.kubernetes.io/name: llm-sa
    app.kubernetes.io/component: rbac
automountServiceAccountToken: false
