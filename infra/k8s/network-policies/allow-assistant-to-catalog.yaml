# ==============================================================================
# NetworkPolicy: allow-assistant-to-catalog
# ==============================================================================
# 1. Authorizes egress from Assistant pods to Catalog pods on port 8005.
# 2. Authorizes ingress on Catalog pods from Assistant pods on port 8005.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-assistant-egress-to-catalog
  namespace: app
  labels:
    app.kubernetes.io/component: security-network-policy
spec:
  podSelector:
    matchLabels:
      app: assistant
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - protocol: TCP
          port: 8005
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-ingress-from-assistant
  namespace: app
  labels:
    app.kubernetes.io/component: security-network-policy
spec:
  podSelector:
    matchLabels:
      app: catalog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: assistant
      ports:
        - protocol: TCP
          port: 8005
