# ==============================================================================
# LLM Inference Service Deployment
# ==============================================================================
# CPU-based LLM inference engine using Qwen2.5-0.5B-Instruct.
# Features an initContainer to reliably download and verify model weights before
# starting the inference server.
# Adheres to Pod Security Standard 'restricted'.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: app
  labels:
    app: llm
    app.kubernetes.io/name: llm
    app.kubernetes.io/component: llm-inference
    app.kubernetes.io/part-of: devsecops-llm-assessment
spec:
  replicas: 1
  # Since model-weights-pvc is ReadWriteOnce, Recreate ensures clean volume unmounting
  # and avoids multi-attach errors during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
        app.kubernetes.io/name: llm
        app.kubernetes.io/component: llm-inference
        app.kubernetes.io/part-of: devsecops-llm-assessment
    spec:
      serviceAccountName: llm-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model-downloader
          image: llm:v1
          imagePullPolicy: Never
          command:
            - python
            - download_model.py
          env:
            - name: MODEL_PATH
              value: "/model-weights/data"
            - name: MODEL_CHECKSUM
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: model-checksum
            - name: HF_HOME
              value: "/tmp/hf"
            - name: TMPDIR
              value: "/tmp"
            - name: HOME
              value: "/tmp"
            - name: XDG_CACHE_HOME
              value: "/tmp/cache"
            - name: HF_HUB_CACHE
              value: "/tmp/hf/hub"
          volumeMounts:
            - name: model-weights
              mountPath: /model-weights
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: llm
          image: llm:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          env:
            - name: MODEL_PATH
              value: "/model-weights/data"
            - name: HF_HOME
              value: "/tmp/hf"
            - name: TMPDIR
              value: "/tmp"
            - name: HOME
              value: "/tmp"
            - name: XDG_CACHE_HOME
              value: "/tmp/cache"
            - name: HF_HUB_CACHE
              value: "/tmp/hf/hub"
          volumeMounts:
            - name: model-weights
              mountPath: /model-weights
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 3000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights-pvc
        - name: tmp-dir
          emptyDir: {}
