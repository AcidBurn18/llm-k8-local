# ==============================================================================
# Assistant Service Deployment
# ==============================================================================
# Business logic service orchestrating context retrieval from catalog
# and prompt generation to LLM. Adheres to Pod Security Standard 'restricted'.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  namespace: app
  labels:
    app: assistant
    app.kubernetes.io/name: assistant
    app.kubernetes.io/component: assistant
    app.kubernetes.io/part-of: devsecops-llm-assessment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: assistant
  template:
    metadata:
      labels:
        app: assistant
        app.kubernetes.io/name: assistant
        app.kubernetes.io/component: assistant
        app.kubernetes.io/part-of: devsecops-llm-assessment
    spec:
      serviceAccountName: assistant-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assistant
          image: assistant:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          env:
            - name: CATALOG_URL
              value: "http://catalog:8005"
            - name: LLM_URL
              value: "http://llm:8005"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
